<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rangers Weighted Spinner</title>
  <style>
    :root {
      --blue: #12296b;
      --red: #d91f3c;
      --ink: #121826;
      --muted: #5e687a;
      --line: #d9e0ee;
      --paper: #ffffff;
      --field: #eef4f8;
      --green: #15804b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(180deg, rgba(18, 41, 107, 0.92), rgba(18, 41, 107, 0.72) 38%, rgba(238, 244, 248, 0.96) 38%),
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.16), transparent 32%),
        var(--field);
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    header {
      color: white;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: #e8efff;
      font-weight: 700;
      line-height: 1.35;
      max-width: 700px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 220px;
    }

    .stat {
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      padding: 9px 11px;
      min-width: 92px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: #e7ecf9;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(310px, 420px);
      gap: 18px;
      align-items: start;
    }

    .wheel-panel,
    .side-panel {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(217, 224, 238, 0.95);
      border-radius: 8px;
      box-shadow: 0 18px 46px rgba(13, 24, 52, 0.16);
    }

    .wheel-panel {
      padding: 18px;
    }

    .wheel-wrap {
      position: relative;
      width: min(680px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: drop-shadow(0 16px 24px rgba(18, 41, 107, 0.2));
    }

    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 19px solid transparent;
      border-right: 19px solid transparent;
      border-top: 42px solid var(--red);
      filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.25));
      z-index: 2;
    }

    .hub {
      position: absolute;
      width: 27%;
      aspect-ratio: 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: white;
      border: 8px solid var(--blue);
      box-shadow: 0 10px 28px rgba(18, 41, 107, 0.22);
      text-align: center;
      padding: 10px;
    }

    .hub strong {
      color: var(--blue);
      font-size: clamp(16px, 3vw, 28px);
      line-height: 1;
    }

    .controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: stretch;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: white;
      font-weight: 900;
      font-size: 20px;
      min-height: 54px;
      padding: 0 28px;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(217, 31, 60, 0.28);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .result {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #f8fbff;
      overflow: hidden;
    }

    .result .badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--blue);
      color: white;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .result strong,
    .result span {
      display: block;
      line-height: 1.2;
    }

    .result strong {
      color: var(--blue);
      font-size: 20px;
    }

    .result span {
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .side-panel {
      overflow: hidden;
    }

    .side-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .side-head h2 {
      margin: 0;
      color: var(--blue);
      font-size: 23px;
      line-height: 1.1;
    }

    .search {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cdd7e8;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .names {
      max-height: min(650px, calc(100vh - 250px));
      overflow: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #edf1f7;
      align-items: center;
    }

    .row strong {
      color: #162550;
      font-size: 15px;
      line-height: 1.2;
    }

    .row small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-weight: 800;
    }

    .rounds {
      min-width: 46px;
      text-align: center;
      border-radius: 999px;
      padding: 7px 9px;
      background: #eef3fb;
      color: var(--blue);
      font-weight: 900;
    }

    .history {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    .mode-panel {
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #d9e3ee;
      border-left: 6px solid var(--red);
      border-radius: 8px;
      background: #f8fbff;
    }

    .mode-panel label,
    .mode-panel strong,
    .mode-panel span {
      display: block;
    }

    .mode-panel label {
      color: var(--blue);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .mode-panel input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cdd7e8;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .mode-panel p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .mode-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary-action {
      min-height: 44px;
      border: 1px solid #cdd7e8;
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .prize-callout {
      margin: 0 0 12px;
      padding: 11px 13px;
      border-radius: 8px;
      background: #fff7e0;
      border: 1px solid #f1d68a;
      color: #745200;
      font-weight: 900;
      line-height: 1.25;
    }

    .winner-chip {
      border-radius: 999px;
      padding: 7px 10px;
      background: #edf8f2;
      color: var(--green);
      border: 1px solid #ccebd9;
      font-size: 13px;
      font-weight: 900;
    }

    @media (max-width: 900px) {
      header,
      .layout {
        display: block;
      }

      .stats {
        justify-content: flex-start;
        margin-top: 15px;
      }

      .side-panel {
        margin-top: 16px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Rangers Weighted Spinner</h1>
        <p>Each golfer gets one entry for every official round played this season. Dropped rounds still count here because this wheel is based on attendance.</p>
      </div>
      <div class="stats" aria-label="Wheel totals">
        <div class="stat"><strong id="playerCount">97</strong><span>Golfers</span></div>
        <div class="stat"><strong id="entryCount">1242</strong><span>Total entries</span></div>
      </div>
    </header>

    <section class="layout">
      <div class="wheel-panel">
        <div class="mode-panel hidden" id="modePanel"></div>
        <div class="prize-callout hidden" id="prizeCallout"></div>
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="1200" height="1200" aria-label="Weighted spinner wheel"></canvas>
          <div class="hub"><strong>Spin</strong></div>
        </div>
        <div class="controls">
          <div class="result" id="result" aria-live="polite">
            <div class="badge">STC</div>
            <div>
              <strong>Ready to spin</strong>
              <span>Odds are weighted by official rounds played.</span>
            </div>
          </div>
          <button id="spinButton" type="button">Spin Wheel</button>
        </div>
        <div class="history" id="history" aria-label="Spin history"></div>
      </div>

      <aside class="side-panel">
        <div class="side-head">
          <h2>Entries by Golfer</h2>
          <input class="search" id="search" type="search" placeholder="Search golfers">
        </div>
        <div class="names" id="names"></div>
      </aside>
    </section>
  </main>

  <script>

      { name: "Aidan Brotherston", flight: "C", rounds: 13 },
      { name: "Kenny Savoie", flight: "C", rounds: 11 },
      { name: "Gary Watton", flight: "C", rounds: 11 },
      { name: "B. Stockwell", flight: "C", rounds: 10 },
      { name: "B. McMath", flight: "C", rounds: 7 },
      { name: "BRODEUR R", flight: "C", rounds: 8 },
      { name: "John Jarrell", flight: "C", rounds: 7 },
      { name: "Steve Murphy", flight: "C", rounds: 7 },
      { name: "RENOLDS M", flight: "C", rounds: 5 },
      { name: "SABOTA M", flight: "C", rounds: 4 },
      { name: "McLINDEN M", flight: "C", rounds: 5 },
      { name: "MALLABAR", flight: "C", rounds: 5 },
      { name: "WEST G", flight: "C", rounds: 4 },
      { name: "MILLER R", flight: "C", rounds: 1 },
      { name: "CRAWLEY S", flight: "C", rounds: 1 }
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const result = document.getElementById("result");
    const names = document.getElementById("names");
    const search = document.getElementById("search");
    const history = document.getElementById("history");
    const modePanel = document.getElementById("modePanel");
    const prizeCallout = document.getElementById("prizeCallout");
    const params = new URLSearchParams(window.location.search);
    const isControl = params.has("control");
    const isLive = params.has("live");
    const controlKey = params.get("key") || "";
    let latestSpinId = "";

    const totalEntries = golfers.reduce((sum, golfer) => sum + golfer.rounds, 0);
    document.getElementById("playerCount").textContent = golfers.length;
    document.getElementById("entryCount").textContent = totalEntries;

    const palette = [
      "#12296b", "#d91f3c", "#16814c", "#f0b429", "#3767b1", "#7a3eb1",
      "#c45f1b", "#00858a", "#8e1f3f", "#596579", "#1f6f9e", "#b53737"
    ];

    const wheel = [];
    let running = 0;
    golfers.forEach((golfer, index) => {
      const start = running / totalEntries;
      running += golfer.rounds;
      const end = running / totalEntries;
      wheel.push({ ...golfer, start, end, color: palette[index % palette.length] });
    });

    let rotation = -Math.PI / 2;
    let spinning = false;

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function percent(golfer) {
      return ((golfer.rounds / totalEntries) * 100).toFixed(2);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function drawWheel() {
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 20;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(rotation);

      wheel.forEach((slice, index) => {
        const startAngle = slice.start * Math.PI * 2;
        const endAngle = slice.end * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = slice.color;
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.68)";
        ctx.lineWidth = 2;
        ctx.stroke();

        const arc = endAngle - startAngle;
        if (arc > 0.045) {
          ctx.save();
          ctx.rotate(startAngle + arc / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "white";
          ctx.font = "700 23px Arial, Helvetica, sans-serif";
          const label = slice.name.length > 15 ? slice.name.slice(0, 14) + "." : slice.name;
          ctx.fillText(label, radius - 26, 0);
          ctx.restore();
        } else if (index % 2 === 0) {
          ctx.save();
          ctx.rotate(startAngle + arc / 2);
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.fillRect(radius - 42, -1, 24, 2);
          ctx.restore();
        }
      });

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.lineWidth = 12;
      ctx.strokeStyle = "white";
      ctx.stroke();
      ctx.restore();
    }

    function golferAtPointer() {
      const pointerAngle = (Math.PI * 1.5 - rotation) % (Math.PI * 2);
      const normalized = pointerAngle < 0 ? pointerAngle + Math.PI * 2 : pointerAngle;
      const position = normalized / (Math.PI * 2);
      return wheel.find(slice => position >= slice.start && position < slice.end) || wheel[0];
    }

    function setPrize(prize) {
      const cleanPrize = String(prize || "").trim();
      if (!cleanPrize) {
        prizeCallout.classList.add("hidden");
        prizeCallout.textContent = "";
        return;
      }
      prizeCallout.textContent = `Now drawing for: ${cleanPrize}`;
      prizeCallout.classList.remove("hidden");
    }

    function setResult(golfer, prize = "") {
      setPrize(prize);
      result.innerHTML = `
        <div class="badge">${initials(golfer.name)}</div>
        <div>
          <strong>${golfer.name}</strong>
          <span>${golfer.flight} Flight | ${golfer.rounds} entries | ${percent(golfer)}% chance${prize ? ` | ${escapeHtml(prize)}` : ""}</span>
        </div>
      `;
    }

    function weightedPick() {
      let ticket = Math.floor(Math.random() * totalEntries);
      for (const golfer of golfers) {
        ticket -= golfer.rounds;
        if (ticket < 0) return golfer;
      }
      return golfers[golfers.length - 1];
    }

    function findGolferByName(name) {
      return golfers.find(golfer => golfer.name === name) || null;
    }

    function targetRotationForGolfer(golfer, turns) {
      const slice = wheel.find(item => item.name === golfer.name) || wheel[0];
      const midpoint = ((slice.start + slice.end) / 2) * Math.PI * 2;
      const desiredRotation = ((Math.PI * 1.5 - midpoint) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const currentRotation = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const delta = (desiredRotation - currentRotation + Math.PI * 2) % (Math.PI * 2);
      return rotation + turns * Math.PI * 2 + delta;
    }

    function spinToGolfer(golfer, prize = "", spinId = "") {
      if (spinning) return;
      spinning = true;
      spinButton.disabled = true;

      const startRotation = rotation;
      const targetRotation = targetRotationForGolfer(golfer, 7 + Math.floor(Math.random() * 3));
      const duration = 5200;
      const started = performance.now();
      if (spinId) latestSpinId = spinId;
      setPrize(prize);

      function frame(now) {
        const elapsed = now - started;
        const t = Math.min(1, elapsed / duration);
        const eased = 1 - Math.pow(1 - t, 4);
        rotation = startRotation + (targetRotation - startRotation) * eased;
        drawWheel();

        if (t < 1) {
          requestAnimationFrame(frame);
          return;
        }

        rotation = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        setResult(golfer, prize);
        addHistory(golfer, prize);
        spinning = false;
        if (!isLive) spinButton.disabled = false;
      }

      requestAnimationFrame(frame);
    }

    async function publishSpin(winner, prize, spinId) {
      if (!isControl) return;
      const response = await fetch("/api/spinner/spin", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Spinner-Key": controlKey,
        },
        body: JSON.stringify({ winner, prize, spinId }),
      });
      if (!response.ok) throw new Error("Live spin request failed.");
    }

    async function clearLiveDisplay() {
      if (!isControl) return;
      const response = await fetch("/api/spinner/reset", {
        method: "POST",
        headers: { "X-Spinner-Key": controlKey },
      });
      if (!response.ok) return;
      prizeCallout.classList.add("hidden");
      result.innerHTML = `
        <div class="badge">STC</div>
        <div>
          <strong>Ready to spin</strong>
          <span>Odds are weighted by official rounds played.</span>
        </div>
      `;
      history.innerHTML = "";
    }

    async function spin() {
      if (spinning || isLive) return;
      const winner = weightedPick();
      const prizeInput = document.getElementById("prizeInput");
      const prize = prizeInput ? prizeInput.value.trim() : "";
      const spinId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      if (isControl) {
        try {
          await publishSpin(winner, prize, spinId);
        } catch {
          result.innerHTML = `
            <div class="badge">!</div>
            <div>
              <strong>Could not send live spin</strong>
              <span>Check the controller link and internet connection.</span>
            </div>
          `;
          return;
        }
      }
      spinToGolfer(winner, prize, spinId);
    }

    function addHistory(golfer, prize = "") {
      const chip = document.createElement("span");
      chip.className = "winner-chip";
      chip.textContent = `${prize ? `${prize}: ` : ""}${golfer.name} (${golfer.rounds})`;
      history.prepend(chip);
      while (history.children.length > 8) history.removeChild(history.lastChild);
    }

    function renderNames() {
      const term = search.value.trim().toLowerCase();
      names.innerHTML = "";
      golfers
        .filter(golfer => !term || golfer.name.toLowerCase().includes(term) || golfer.flight.toLowerCase() === term)
        .forEach(golfer => {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div>
              <strong>${golfer.name}</strong>
              <small>${golfer.flight} Flight | ${percent(golfer)}% chance</small>
            </div>
            <div class="rounds">${golfer.rounds}</div>
          `;
          names.appendChild(row);
        });
    }

    function configureMode() {
      if (isControl) {
        document.title = "Spinner Control | STC Rangers";
        document.querySelector("h1").textContent = "Spinner Control";
        document.querySelector("header p").textContent = "Type or dictate the prize name, then spin. The live display page will update for everyone in the room.";
        modePanel.innerHTML = `
          <label for="prizeInput">Prize name</label>
          <input id="prizeInput" type="text" autocomplete="off" placeholder="Tap here and use your phone mic">
          <p>Use your phone keyboard microphone here for voice dictation, then tap Spin Live Wheel.</p>
          <div class="mode-actions">
            <button class="secondary-action" id="clearDisplayButton" type="button">Clear Display</button>
          </div>
        `;
        modePanel.classList.remove("hidden");
        spinButton.textContent = "Spin Live Wheel";
        modePanel.querySelector("#clearDisplayButton").addEventListener("click", clearLiveDisplay);
        return;
      }

      if (isLive) {
        document.title = "Live Spinner | STC Rangers";
        document.querySelector("h1").textContent = "Live Spinner";
        document.querySelector("header p").textContent = "Waiting for Casey's phone controller. Leave this page open on the banquet screen.";
        modePanel.innerHTML = `<strong>Live display mode</strong><p>When the phone controller spins, this screen will animate and show the winner.</p>`;
        modePanel.classList.remove("hidden");
        spinButton.classList.add("hidden");
        spinButton.disabled = true;
        connectLiveDisplay();
      }
    }

    async function applyRemoteState(state) {
      if (!state || !state.winner || !state.spinId || state.spinId === latestSpinId) return;
      const golfer = findGolferByName(state.winner.name);
      if (!golfer) return;
      spinToGolfer(golfer, state.prize || "", state.spinId);
    }

    async function connectLiveDisplay() {
      try {
        const response = await fetch("/api/spinner/state", { cache: "no-store" });
        const payload = await response.json();
        await applyRemoteState(payload.state);
      } catch {
        // The EventSource connection below will keep trying.
      }

      const events = new EventSource("/api/spinner/events");
      events.onmessage = (event) => {
        try {
          applyRemoteState(JSON.parse(event.data));
        } catch {
          // Ignore malformed event payloads.
        }
      };
      events.onerror = () => {
        result.innerHTML = `
          <div class="badge">...</div>
          <div>
            <strong>Reconnecting</strong>
            <span>Waiting for the live spinner connection.</span>
          </div>
        `;
      };
    }

    configureMode();
    spinButton.addEventListener("click", spin);
    search.addEventListener("input", renderNames);
    drawWheel();
    renderNames();
  </script>
</body>
</html>
